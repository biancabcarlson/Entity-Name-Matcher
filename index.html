<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Entity Name Matcher — Live Demo</title>
<style>
  body { font-family: -apple-system, sans-serif; max-width: 700px; margin: 40px auto; padding: 0 20px; background: #0d1117; color: #e6edf3; }
  h1 { font-size: 1.4em; }
  textarea { width: 100%; height: 160px; background: #161b22; color: #e6edf3; border: 1px solid #30363d; border-radius: 6px; padding: 10px; font-family: monospace; }
  button { background: #238636; color: white; border: none; padding: 10px 18px; border-radius: 6px; font-size: 1em; cursor: pointer; margin-top: 10px; }
  table { width: 100%; border-collapse: collapse; margin-top: 15px; }
  td, th { border-bottom: 1px solid #30363d; padding: 6px 8px; text-align: left; font-size: 0.9em; }
  th { color: #8b949e; }
  label { display: block; margin-top: 10px; font-size: 0.9em; color: #8b949e; }
</style>
</head>
<body>

<h1>Entity Name Matcher — Live Demo</h1>
<p>Paste a list of names (one per line) and click Find Matches. Runs entirely in your browser using standard string-similarity math — nothing is uploaded.</p>

<textarea id="input">Jonathan A. Smith
Jon Smith
Maria Garcia-Lopez
Maria Garcia Lopez
Robert Chen
Rob Chen Jr.
Patricia Nguyen
Pat Nguyen
Ahmed Al-Farsi
David Thompson</textarea>

<label>Similarity threshold (0–1):</label>
<input id="threshold" type="number" value="0.75" step="0.05" min="0" max="1" style="width:80px;">

<br><button onclick="run()">Find Matches</button>

<table id="results"></table>

<script>
function levenshtein(a, b) {
  a = a.toLowerCase(); b = b.toLowerCase();
  if (a.length < b.length) [a, b] = [b, a];
  let prev = Array.from({length: b.length + 1}, (_, i) => i);
  for (let i = 1; i <= a.length; i++) {
    const curr = [i];
    for (let j = 1; j <= b.length; j++) {
      const cost = a[i-1] === b[j-1] ? 0 : 1;
      curr.push(Math.min(prev[j] + 1, curr[j-1] + 1, prev[j-1] + cost));
    }
    prev = curr;
  }
  return prev[prev.length - 1];
}

function similarity(a, b) {
  const dist = levenshtein(a, b);
  const longest = Math.max(a.length, b.length);
  return longest ? 1 - dist / longest : 1;
}

function run() {
  const names = document.getElementById('input').value.trim().split("\n").map(n => n.trim()).filter(Boolean);
  const threshold = parseFloat(document.getElementById('threshold').value) || 0.75;
  const matches = [];

  for (let i = 0; i < names.length; i++) {
    for (let j = i + 1; j < names.length; j++) {
      const score = similarity(names[i], names[j]);
      if (score >= threshold) matches.push([names[i], names[j], score.toFixed(3)]);
    }
  }
  matches.sort((a, b) => b[2] - a[2]);

  let html = "<tr><th>Name A</th><th>Name B</th><th>Similarity</th></tr>";
  matches.forEach(m => html += `<tr><td>${m[0]}</td><td>${m[1]}</td><td>${m[2]}</td></tr>`);
  if (matches.length === 0) html += "<tr><td colspan='3'>No matches above threshold.</td></tr>";
  document.getElementById('results').innerHTML = html;
}
run();
</script>

</body>
</html>
